# This is a kitty.conf file generated from your YAML config.

# === Environment ===
env TERM=xterm-256color

# === Window ===
window_border_width 2
active_border_color #D3D3D3
inactive_border_color #D3D3D3

# Set initial window size in cells (columns/lines)
initial_window_width  100c
initial_window_height 30c

window_padding_width 10
hide_window_decorations yes
background_opacity 0.80
dynamic_title yes

# === Scrolling ===
wheel_scroll_multiplier 3

# === Font ===
font_size 14.0
# font_family FiraCode Nerd Font
# bold_font auto
# italic_font auto
# bold_italic_font auto

# === Colors (Catppuccin Mocha) ===
foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
cursor_text_color #1e1e2e

# Normal colors
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de

# Bright colors
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

# === Bell ===
enable_audio_bell no

# === Mouse ===
mouse_hide_wait 3.0
